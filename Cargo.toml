[package]
name = "agy-sync"
version = "0.1.0"
edition = "2021"
description = "Intelligent multi-harness project workspace and session synchronization engine for the Agy ecosystem (~/.gemini)"

[[bin]]
name = "agy-sync"
path = "src/main.rs"

[lib]
name = "agy_sync"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.13"
